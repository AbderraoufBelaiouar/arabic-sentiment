[project]
name = "arabic-sentiment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abderraouf Belaiouar", email = "abderraouf.belaiouar@ens.uvsq.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.1.0",
    "arabert>=1.0.1",
    "fastapi>=0.142.2",
    "onnx>=1.15.0",
    "onnxruntime>=1.16.3",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.1",
    "sentencepiece",
    "torch>=2.14.1",
    "transformers>=5.18.0",
    "uvicorn>=0.54.0",
    "mlflow>=2.10.0",
    "locust>=2.24.0",
    "bentoml>=1.2.0",
]

[project.scripts]
arabic-sentiment = "arabic_sentiment.train:main"
arabic-sentiment-export = "arabic_sentiment.export:main"
[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"


[project.optional-dependencies]
dev = [
    "black>=26.5.1",
    "datasets>=3.0.0",
    "dvc>=3.0.0",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]


[tool.pytest.ini_options]
addopts = "--cov=src/arabic_sentiment --cov-fail-under=70"

[tool.coverage.run]
omit = [
    "src/arabic_sentiment/train.py",
    "src/arabic_sentiment/mock_mlflow.py",
    "src/arabic_sentiment/export.py",
    "src/arabic_sentiment/batch_score.py",
    "src/arabic_sentiment/serving/*",
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[dependency-groups]
dev = [
    "mypy>=2.4.0",
]
