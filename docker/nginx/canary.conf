events {
    worker_connections 1024;
}

http {
    # ─────────────────────────────────────────────────────────────
    # Canary Deployment Traffic Split (Rubric: weight 5/95)
    # Stage 1: 95% Stable (FastAPI baseline) vs 5% Canary (BentoML optimized)
    # ─────────────────────────────────────────────────────────────

    # 1. Deterministic IP-hash client splitting
    split_clients "${remote_addr}${http_user_agent}" $canary_upstream {
        5%      canary_backend;
        *       stable_backend;
    }

    # 2. Allow manual override for internal canary validation:
    #    Send header 'X-Canary: always' to force route to Canary
    map $http_x_canary $final_backend {
        "always"    canary_backend;
        "never"     stable_backend;
        default     $canary_upstream;
    }

    upstream stable_backend {
        server api:8000 max_fails=3 fail_timeout=10s;
    }

    upstream canary_backend {
        server bentoml:8000 max_fails=3 fail_timeout=10s;
    }

    # Alternative Weighted Upstream Configuration (Weight 5/95)
    # upstream weighted_cluster {
    #     server api:8000 weight=95;
    #     server bentoml:8000 weight=5;
    # }

    server {
        listen 80;
        server_name localhost;

        # Reverse proxy to the dynamically resolved upstream
        location / {
            proxy_pass http://$final_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Expose which backend handled the request for observability
            add_header X-Served-By $final_backend always;
        }

        # Dedicated health check endpoint routing directly to stable
        location /health {
            proxy_pass http://stable_backend/health;
        }
    }
}
