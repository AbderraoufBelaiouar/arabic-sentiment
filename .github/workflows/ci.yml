  name: CI/CD Pipeline
  on:
    push:
      branches: [ main ] # Runs every time you push to main!
    pull_request:
      branches: [ main ]

  jobs:
    lint_and_test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Install uv
          uses: astral-sh/setup-uv@v3
          with:
            enable-cache: true
            
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.12"

        - name: Install dependencies
          run: uv sync --all-extras
        - name: Pull data from DVC
          run: uv run dvc pull
          env:
            GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        # Requirement 1: Lint
        - name: Lint with ruff
          run: uv run ruff check src tests
          
        # Requirement 2: Test
        - name: Run Unit Tests
          run: uv run pytest tests/
          
        # Requirement 3: Quality Gate (from Step 1)
        - name: Verify Model Metrics Baseline
          run: uv run python .github/scripts/check_metrics.py
          
    build_docker:
      needs: lint_and_test
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        
        # Requirement 4: Docker Build & Push
        - name: Login to DockerHub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
            
        - name: Build and push
          uses: docker/build-push-action@v5
          with:
            context: .
            file: docker/Dockerfile
            push: true
            tags: ${{ secrets.DOCKERHUB_USERNAME }}/arabic-sentiment:latest
